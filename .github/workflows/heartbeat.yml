name: Heartbeat

# GitHub 会在公开仓库连续 60 天无活动后自动停用 schedule。
# 每月写入一行心跳并提交，保持仓库活跃，同时留下运行审计痕迹。

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append heartbeat
        run: |
          echo "- $(date -u +'%Y-%m-%d %H:%M UTC') heartbeat" >> docs/HEARTBEAT.md
          git config user.name "global-intel-bot"
          git config user.email "global-intel@users.noreply.github.com"
          git add docs/HEARTBEAT.md
          git commit -m "chore: heartbeat $(date -u +%Y-%m)" || exit 0
          git push