name: Global Intel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: auto
        options: [auto, hourly, morning, evening]

concurrency:
  group: global-intel
  cancel-in-progress: false

permissions:
  contents: write   # 需要提交 docs/ 下的简报页面到 GitHub Pages

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e vendor/TrendRadar --no-deps

      - name: Self test
        run: python scripts/selftest.py

      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: |
            output
            data
          key: intel-data-${{ github.run_id }}
          restore-keys: intel-data-

      - name: Run pipeline
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          WM_KEY: ${{ secrets.WM_KEY }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          python -m intel.run --mode "$MODE"

      - name: Publish digest to GitHub Pages
        if: always()
        run: |
          if [ ! -d docs/digests ]; then echo "no digest generated"; exit 0; fi
          git config user.name "global-intel-bot"
          git config user.email "global-intel@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "digest: $(date -u +%F) $(date -u +%H:%M)"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            echo "push retry $i"
            git pull --rebase origin main || true
          done

      - name: Prune old files
        if: always()
        run: |
          find output -type f -mtime +9 -delete 2>/dev/null || true
          find data/logs -type f -mtime +3 -delete 2>/dev/null || true

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output
            data
          key: intel-data-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intel-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7